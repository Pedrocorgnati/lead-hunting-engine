name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: --redact --verbose --config=.gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-typecheck:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npm run type-check

  test:
    name: Unit Tests (jest)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      # Valores dummy apenas para satisfazer lib/env Zod durante o load dos modulos.
      # Testes unitarios nao acessam banco de verdade. Testes de integracao ficam em workflow separado.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run unit tests
        run: npm run test -- --ci --passWithNoTests

  test-integration:
    name: Integration Tests (jest, real DB)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 15
    # M2-5 / G-009 (herdado M1): destravado quando DATABASE_URL_TEST estiver
    # configurado em GitHub > Settings > Secrets and variables > Actions.
    # IMPORTANTE: requer secret DEDICADO (DATABASE_URL_TEST). NAO faz fallback
    # para DATABASE_URL para evitar `migrate deploy` + `seed:test` em DB de prod.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_TEST }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_TEST }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      DIRECT_URL: ${{ secrets.DIRECT_URL_TEST }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_TEST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Check DATABASE_URL_TEST secret (TEST DB ONLY)
        id: check-db
        run: |
          if [ -z "${{ env.DATABASE_URL }}" ] || [ -z "${{ env.DIRECT_URL }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning ::DATABASE_URL_TEST/DIRECT_URL_TEST nao configurados — pulando integration tests. Configure secrets DEDICADOS (NAO reutilize prod): GitHub > Settings > Secrets and variables > Actions."
          else
            # Sanity guard: rejeitar URLs que apontam claramente para prod.
            if echo "${{ env.DATABASE_URL }}" | grep -qiE "(prod|production|main)"; then
              echo "::error ::DATABASE_URL_TEST parece apontar para producao. Recuse-se a rodar migrate deploy/seed contra prod."
              exit 1
            fi
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
      - name: Install dependencies
        if: steps.check-db.outputs.configured == 'true'
        run: npm ci
      - name: Generate Prisma Client
        if: steps.check-db.outputs.configured == 'true'
        run: npx prisma generate
      - name: Run migrations on test DB (DATABASE_URL_TEST only)
        if: steps.check-db.outputs.configured == 'true'
        run: npx prisma migrate deploy
      - name: Seed test data
        if: steps.check-db.outputs.configured == 'true'
        run: npm run seed:test
      - name: Run integration tests
        if: steps.check-db.outputs.configured == 'true'
        run: npm run test:integration -- --ci

  openapi-drift:
    name: OpenAPI Contract Drift Check
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate OpenAPI spec
        run: npm run openapi:generate
      - name: Check for drift
        run: |
          if ! git diff --exit-code openapi.json; then
            echo "::error ::openapi.json desatualizado. Execute 'npm run openapi:generate' localmente e commite o arquivo atualizado."
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build
        run: npm run build

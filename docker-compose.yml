# ============================================
# DOCKER COMPOSE — DESENVOLVIMENTO LOCAL
# Lead Hunting Engine
# Uso: docker compose up
#
# NOTA SOBRE SUPABASE AUTH:
# Este compose sobe um PostgreSQL local para Prisma (schema + queries).
# As funcionalidades de Auth do Supabase (login, JWT, RLS) requerem
# o Supabase local stack separado:
#   npx supabase start
# Para dev completo, use o .env local diretamente sem Docker.
# ============================================

services:
  app:
    # Next 16 / React 19 exigem Node moderno; node:24-alpine acompanha o dev local.
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    # Workspace e pnpm-canonico: npm install recria package-lock.json e corrompe
    # node_modules (preinstall guard bloqueia). corepack ativa o pnpm embarcado.
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    ports:
      # Porta host 5434: 5432 (postgres local) e 5433 ja sao ocupadas em dev tipico.
      # Dentro da rede do compose o app continua falando com db:5432.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app_node_modules:
  db_data:
